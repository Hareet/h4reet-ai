# The stack's OpenTelemetry collector (spec 000 FR-026, FR-027, FR-029, FR-037; plan §6; contracts/telemetry.md §6;
# ADRs 0004 and 0021). Mounted read-only, so compose never interpolates it: the collector expands each ${env:...}
# itself, from the four variables compose gives it and nothing else: LANGFUSE_PUBLIC_KEY, LANGFUSE_SECRET_KEY,
# TELEMETRY_PAYLOAD_SAMPLING, and H4_STACK.
#
#   traces           otlp         > memory_limiter > filter/probes > transform/payloads > redaction > transform/redact-text > resource > batch > otlphttp/langfuse
#   metrics          otlp         > memory_limiter > redaction > resource > batch > otlphttp/prometheus
#   metrics/devtime  otlp/devtime > memory_limiter > filter/devtime > transform/devtime > deltatocumulative > resource > batch > otlphttp/prometheus
#   logs             otlp         > memory_limiter > transform/payloads > redaction > transform/redact-text > resource > batch > otlphttp/loki
#
# The secret patterns (telemetry.md §6.3) appear twice: as Go regular expressions in redaction's blocked_values, and
# inside OTTL strings in transform/redact-text, where every backslash is doubled because OTTL unquotes its strings.
# deploy/scripts/test_observability.py checks both copies against the contract and the gateway's own fixtures.

extensions:
  # For the breach probe and make status; the image has no shell, so compose has no health check for it.
  health_check:
    endpoint: 0.0.0.0:13133
  # Langfuse's project keys, the same pair its headless initialization creates (env-files.md §5).
  basicauth/langfuse:
    client_auth:
      username: ${env:LANGFUSE_PUBLIC_KEY}
      password: ${env:LANGFUSE_SECRET_KEY}

receivers:
  # The stack's own services, on the internal network: the collector joins no other.
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        max_recv_msg_size_mib: 4
      http:
        endpoint: 0.0.0.0:4318
        max_request_body_size: 4194304
  # Dev-time metrics only, from edge's x004 (POST /v1/metrics, at most 1 MiB): Claude Code and tools/gates/gate.
  otlp/devtime:
    protocols:
      http:
        endpoint: 0.0.0.0:4319
        max_request_body_size: 1048576

processors:
  # Over the limit, the receivers refuse and the senders drop; nothing blocks. The container's cap is 256 MiB.
  memory_limiter:
    check_interval: 1s
    limit_mib: 200
    spike_limit_mib: 50

  # Health and metrics probes never reach Langfuse. h4.probe is reserved for spec 001's synthetic monitoring.
  filter/probes:
    error_mode: ignore
    traces:
      span:
        - 'attributes["h4.probe"] == true'
        - 'IsMatch(attributes["url.path"], "^/(health(/live)?|metrics|ping)$")'
        - 'IsMatch(attributes["http.route"], "^/(health(/live)?|metrics|ping)$")'
      spanevent:
        - 'IsMatch(name, "^gen_ai\\.")'

  # FR-029: no payload unless the span opts in and this collector's own switch is on (dev only), and never a client
  # identifier. Then the cost attribute Langfuse reads (telemetry.md §3.5): it reads gen_ai.usage.cost and
  # langfuse.observation.cost_details alike, and the plain number is kept (T149, on dev-cpu).
  transform/payloads:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - 'delete_matching_keys(attributes, "^(gen_ai\\.(input|output)\\.messages|gen_ai\\.system_instructions|gen_ai\\.(prompt|completion)(\\..*)?|langfuse\\.observation\\.(input|output)|input\\.value|output\\.value|http\\.(request|response)\\.body(\\..*)?)$") where not (attributes["h4.payload.sampled"] == true and "${env:TELEMETRY_PAYLOAD_SAMPLING}" == "on")'
          - 'delete_key(attributes, "client.address")'
          - 'delete_key(attributes, "client.port")'
          - 'delete_key(attributes, "network.peer.address")'
          - 'delete_key(attributes, "network.peer.port")'
          - 'delete_key(attributes, "user_agent.original")'
          - 'delete_key(attributes, "url.query")'
          - 'delete_key(attributes, "authorization")'
          - 'delete_key(attributes, "cookie")'
          - 'delete_matching_keys(attributes, "^http\\.(request|response)\\.header\\..*$")'
          - 'set(attributes["gen_ai.usage.cost"], attributes["h4.cost.usd"]) where attributes["h4.cost.usd"] != nil'
      - context: spanevent
        statements:
          - 'delete_matching_keys(attributes, "^(gen_ai\\.(input|output)\\.messages|gen_ai\\.system_instructions|gen_ai\\.(prompt|completion)(\\..*)?|langfuse\\.observation\\.(input|output)|input\\.value|output\\.value|http\\.(request|response)\\.body(\\..*)?)$") where not (span.attributes["h4.payload.sampled"] == true and "${env:TELEMETRY_PAYLOAD_SAMPLING}" == "on")'
    log_statements:
      - context: log
        statements:
          - 'delete_matching_keys(attributes, "^(gen_ai\\.(input|output)\\.messages|gen_ai\\.system_instructions|gen_ai\\.(prompt|completion)(\\..*)?|langfuse\\.observation\\.(input|output)|input\\.value|output\\.value|http\\.(request|response)\\.body(\\..*)?|messages|prompt|completion)$")'
          - 'delete_key(attributes, "client.address")'
          - 'delete_key(attributes, "client.port")'
          - 'delete_key(attributes, "network.peer.address")'
          - 'delete_key(attributes, "network.peer.port")'
          - 'delete_key(attributes, "user_agent.original")'
          - 'delete_key(attributes, "url.query")'
          - 'delete_key(attributes, "authorization")'
          - 'delete_key(attributes, "cookie")'
          - 'delete_matching_keys(attributes, "^http\\.(request|response)\\.header\\..*$")'

  # Every attribute value of every signal, masked with **** where a secret shape matches (FR-029).
  redaction:
    allow_all_keys: true
    summary: info
    blocked_values:
      - '-----BEGIN [A-Z0-9 ]+-----[\s\S]*?-----END [A-Z0-9 ]+-----'
      - "(?:sk|pk)-lf-[0-9A-Za-z-]{8,}"
      - '\b(?:AKIA|ASIA)[0-9A-Z]{16}\b'
      - "(?:bot)?[0-9]{6,12}:[A-Za-z0-9_-]{30,}"
      - "h4op_(?:prod|dev|devcpu)_[A-Za-z0-9_-]{43}"
      - 'eyJ[A-Za-z0-9_-]{8,}\.eyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}'
      - '(?i)\b(?:bearer|basic)\s+[A-Za-z0-9._~+/=-]{8,}'
      - '[A-Za-z][A-Za-z0-9+.-]*://[^\s/:@]+:[^\s/@]+@'
      - '(?i)\b(?:password|passwd|secret|token|api[_-]?key)\s*[=:]\s*[^\s,;]+'

  # redaction covers attribute values; this covers the text fields, with the same patterns in the same order.
  transform/redact-text:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - 'replace_pattern(name, "-----BEGIN [A-Z0-9 ]+-----[\\s\\S]*?-----END [A-Z0-9 ]+-----", "****")'
          - 'replace_pattern(name, "(?:sk|pk)-lf-[0-9A-Za-z-]{8,}", "****")'
          - 'replace_pattern(name, "\\b(?:AKIA|ASIA)[0-9A-Z]{16}\\b", "****")'
          - 'replace_pattern(name, "(?:bot)?[0-9]{6,12}:[A-Za-z0-9_-]{30,}", "****")'
          - 'replace_pattern(name, "h4op_(?:prod|dev|devcpu)_[A-Za-z0-9_-]{43}", "****")'
          - 'replace_pattern(name, "eyJ[A-Za-z0-9_-]{8,}\\.eyJ[A-Za-z0-9_-]{8,}\\.[A-Za-z0-9_-]{8,}", "****")'
          - 'replace_pattern(name, "(?i)\\b(?:bearer|basic)\\s+[A-Za-z0-9._~+/=-]{8,}", "****")'
          - 'replace_pattern(name, "[A-Za-z][A-Za-z0-9+.-]*://[^\\s/:@]+:[^\\s/@]+@", "****")'
          - 'replace_pattern(name, "(?i)\\b(?:password|passwd|secret|token|api[_-]?key)\\s*[=:]\\s*[^\\s,;]+", "****")'
          - 'replace_pattern(status.message, "-----BEGIN [A-Z0-9 ]+-----[\\s\\S]*?-----END [A-Z0-9 ]+-----", "****")'
          - 'replace_pattern(status.message, "(?:sk|pk)-lf-[0-9A-Za-z-]{8,}", "****")'
          - 'replace_pattern(status.message, "\\b(?:AKIA|ASIA)[0-9A-Z]{16}\\b", "****")'
          - 'replace_pattern(status.message, "(?:bot)?[0-9]{6,12}:[A-Za-z0-9_-]{30,}", "****")'
          - 'replace_pattern(status.message, "h4op_(?:prod|dev|devcpu)_[A-Za-z0-9_-]{43}", "****")'
          - 'replace_pattern(status.message, "eyJ[A-Za-z0-9_-]{8,}\\.eyJ[A-Za-z0-9_-]{8,}\\.[A-Za-z0-9_-]{8,}", "****")'
          - 'replace_pattern(status.message, "(?i)\\b(?:bearer|basic)\\s+[A-Za-z0-9._~+/=-]{8,}", "****")'
          - 'replace_pattern(status.message, "[A-Za-z][A-Za-z0-9+.-]*://[^\\s/:@]+:[^\\s/@]+@", "****")'
          - 'replace_pattern(status.message, "(?i)\\b(?:password|passwd|secret|token|api[_-]?key)\\s*[=:]\\s*[^\\s,;]+", "****")'
          - 'replace_pattern(attributes["url.full"], "\\?.*$", "")'
      - context: spanevent
        statements:
          - 'replace_pattern(name, "-----BEGIN [A-Z0-9 ]+-----[\\s\\S]*?-----END [A-Z0-9 ]+-----", "****")'
          - 'replace_pattern(name, "(?:sk|pk)-lf-[0-9A-Za-z-]{8,}", "****")'
          - 'replace_pattern(name, "\\b(?:AKIA|ASIA)[0-9A-Z]{16}\\b", "****")'
          - 'replace_pattern(name, "(?:bot)?[0-9]{6,12}:[A-Za-z0-9_-]{30,}", "****")'
          - 'replace_pattern(name, "h4op_(?:prod|dev|devcpu)_[A-Za-z0-9_-]{43}", "****")'
          - 'replace_pattern(name, "eyJ[A-Za-z0-9_-]{8,}\\.eyJ[A-Za-z0-9_-]{8,}\\.[A-Za-z0-9_-]{8,}", "****")'
          - 'replace_pattern(name, "(?i)\\b(?:bearer|basic)\\s+[A-Za-z0-9._~+/=-]{8,}", "****")'
          - 'replace_pattern(name, "[A-Za-z][A-Za-z0-9+.-]*://[^\\s/:@]+:[^\\s/@]+@", "****")'
          - 'replace_pattern(name, "(?i)\\b(?:password|passwd|secret|token|api[_-]?key)\\s*[=:]\\s*[^\\s,;]+", "****")'
    log_statements:
      - context: log
        statements:
          - 'replace_pattern(body, "-----BEGIN [A-Z0-9 ]+-----[\\s\\S]*?-----END [A-Z0-9 ]+-----", "****") where IsString(body)'
          - 'replace_pattern(body, "(?:sk|pk)-lf-[0-9A-Za-z-]{8,}", "****") where IsString(body)'
          - 'replace_pattern(body, "\\b(?:AKIA|ASIA)[0-9A-Z]{16}\\b", "****") where IsString(body)'
          - 'replace_pattern(body, "(?:bot)?[0-9]{6,12}:[A-Za-z0-9_-]{30,}", "****") where IsString(body)'
          - 'replace_pattern(body, "h4op_(?:prod|dev|devcpu)_[A-Za-z0-9_-]{43}", "****") where IsString(body)'
          - 'replace_pattern(body, "eyJ[A-Za-z0-9_-]{8,}\\.eyJ[A-Za-z0-9_-]{8,}\\.[A-Za-z0-9_-]{8,}", "****") where IsString(body)'
          - 'replace_pattern(body, "(?i)\\b(?:bearer|basic)\\s+[A-Za-z0-9._~+/=-]{8,}", "****") where IsString(body)'
          - 'replace_pattern(body, "[A-Za-z][A-Za-z0-9+.-]*://[^\\s/:@]+:[^\\s/@]+@", "****") where IsString(body)'
          - 'replace_pattern(body, "(?i)\\b(?:password|passwd|secret|token|api[_-]?key)\\s*[=:]\\s*[^\\s,;]+", "****") where IsString(body)'

  # The stack label is the collector's, not the sender's (telemetry.md §2); no host or process identity is stored.
  resource:
    attributes:
      - key: service.namespace
        value: h4reet
        action: upsert
      - key: deployment.environment.name
        value: ${env:H4_STACK}
        action: upsert
      - key: host.name
        action: delete
      - pattern: '^process\..*'
        action: delete

  # The 2 s step of the freshness budget (telemetry.md §6.5).
  batch:
    timeout: 2s
    send_batch_size: 512
    send_batch_max_size: 1024

  # x004 writes dev-time metrics and nothing else: Claude Code's and the eval history's, from those two senders.
  filter/devtime:
    error_mode: ignore
    metrics:
      metric:
        - 'not (IsMatch(name, "^(claude_code|h4\\.devtime)\\.") and (resource.attributes["service.name"] == "claude-code" or resource.attributes["service.name"] == "h4-gate"))'

  # No account, email, or organization identifier is stored.
  transform/devtime:
    error_mode: ignore
    metric_statements:
      - context: resource
        statements:
          - 'delete_matching_keys(attributes, "^(user\\..*|organization\\.id|terminal\\.type|app\\.version|host\\..*|os\\..*)$")'
      - context: datapoint
        statements:
          - 'delete_matching_keys(attributes, "^(user\\..*|organization\\.id|terminal\\.type|app\\.version|host\\..*|os\\..*)$")'

  # Claude Code may export deltas; Prometheus takes cumulative series only.
  deltatocumulative:
    max_stale: 10m
    max_streams: 1000

exporters:
  # Langfuse takes OTLP over HTTP. The in-memory queue holds about 10 minutes of test traffic while it is down.
  otlphttp/langfuse:
    traces_endpoint: http://langfuse-web:3000/api/public/otel/v1/traces
    auth:
      authenticator: basicauth/langfuse
    # Langfuse 4.54.0 takes gzip: a gzip-encoded request on dev-cpu got 200 and its generation (T149).
    compression: gzip
    timeout: 10s
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 600s
    sending_queue:
      enabled: true
      num_consumers: 2
      queue_size: 600
  otlphttp/prometheus:
    metrics_endpoint: http://prometheus:9090/api/v1/otlp/v1/metrics
    compression: gzip
    retry_on_failure:
      enabled: true
      max_elapsed_time: 120s
    sending_queue:
      enabled: true
      queue_size: 120
  otlphttp/loki:
    logs_endpoint: http://loki:3100/otlp/v1/logs
    compression: gzip
    retry_on_failure:
      enabled: true
      max_elapsed_time: 300s
    sending_queue:
      enabled: true
      queue_size: 300

service:
  extensions: [health_check, basicauth/langfuse]
  telemetry:
    logs:
      level: info
    # The collector's own metrics carry the stack's labels, as the gateway's do (telemetry.md §2), and a stable
    # instance, so a restart reads as a counter reset in the same series.
    resource:
      attributes:
        - { name: service.name, value: otel-collector }
        - { name: service.namespace, value: h4reet }
        - { name: deployment.environment.name, value: "${env:H4_STACK}" }
        - { name: service.instance.id, value: "${env:H4_STACK}-otel-collector" }
    # The collector's own metrics (telemetry.md §4.3, T185). Pushed every 10 s to Prometheus's OTLP receiver, where
    # the gateway's metrics arrive, so each series carries its start time and Prometheus writes the 0 there: a fresh
    # collector's first batch counts in rate() and increase(). Straight to Prometheus, not through this collector's
    # own pipelines, so the counters that report a refusing receiver or a full queue never wait in either. The pull
    # reader on 8888 stays for the scrape, which keeps only up (deploy/prometheus/prometheus.yml).
    metrics:
      level: normal
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
        - periodic:
            interval: 10000
            exporter:
              otlp:
                protocol: http/protobuf
                endpoint: http://prometheus:9090/api/v1/otlp/v1/metrics
                compression: gzip
                temporality_preference: cumulative
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, filter/probes, transform/payloads, redaction, transform/redact-text, resource, batch]
      exporters: [otlphttp/langfuse]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, redaction, resource, batch]
      exporters: [otlphttp/prometheus]
    metrics/devtime:
      receivers: [otlp/devtime]
      processors: [memory_limiter, filter/devtime, transform/devtime, deltatocumulative, resource, batch]
      exporters: [otlphttp/prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, transform/payloads, redaction, transform/redact-text, resource, batch]
      exporters: [otlphttp/loki]
