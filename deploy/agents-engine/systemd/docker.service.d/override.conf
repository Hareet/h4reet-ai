# Rootless dockerd for the agents' engine (spec 000, FR-039; contracts/agents-engine.md §2.1, §5 H5,H14).
# A drop-in over the docker.service that dockerd-rootless-setuptool.sh installs for h4agents. It pins
# slirp4netns with host loopback disabled (so containers cannot reach the host's 127.0.0.1), publishes
# the API on the engine's address, and sends the daemon's own pulls through the egress proxy.
# Installed to ~h4agents/.config/systemd/user/docker.service.d/ by engine.sh setup.
[Service]
Environment="DOCKERD_ROOTLESS_ROOTLESSKIT_NET=slirp4netns"
Environment="DOCKERD_ROOTLESS_ROOTLESSKIT_DISABLE_HOST_LOOPBACK=true"
Environment="DOCKERD_ROOTLESS_ROOTLESSKIT_FLAGS=--publish 198.18.0.1:2376:2376/tcp"
Environment="HTTPS_PROXY=http://198.18.0.1:3128"
Environment="HTTP_PROXY=http://198.18.0.1:3128"
Environment="NO_PROXY=127.0.0.1,localhost"
