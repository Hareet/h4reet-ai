# The agents' engine resource cap (spec 000, FR-039; contracts/agents-engine.md §5, H12; research R-37).
# A drop-in for h4agents' user slice. engine.sh setup installs it at
# /etc/systemd/system/user-<uid>.slice.d/h4agents.conf, substituting h4agents' uid. 16 GB holds the
# dev-cpu stack's summed memory limits (about 13.2 GiB with the breach probe); real use is 5-6 GB. The
# host has 24 CPUs and 62 GB, so the engine cannot starve prod of CPU or memory.
[Slice]
CPUQuota=400%
MemoryMax=16G
TasksMax=4096
