# The shared state's Postgres (spec 001 contracts/shared-state.md §1): the tunnel end's `shared-state` service reads it
# read-only from the release's tree, with -c config_file. TLS on every TCP connection, from the key and certificate the
# host script writes to tmpfs; no statement or value in a log.
data_directory = '/var/lib/postgresql/data/pgdata'
hba_file = '/etc/h4reet/shared-state/pg_hba.conf'

# Inside the container, every interface: its compose networks. On the host, compose publishes 5432 on the private
# interface's fixed address alone.
listen_addresses = '*'
port = 5432
max_connections = 50

ssl = on
ssl_cert_file = '/run/shared-state/server.crt'
ssl_key_file = '/run/shared-state/server.key'
ssl_min_protocol_version = 'TLSv1.3'
password_encryption = 'scram-sha-256'

# The tunnel end's small share of memory (T166 measures it).
shared_buffers = 32MB
work_mem = 2MB
maintenance_work_mem = 16MB

log_destination = 'stderr'
log_statement = 'none'
log_min_duration_statement = -1
log_connections = off
log_disconnections = off
log_line_prefix = '%m [%p] '
