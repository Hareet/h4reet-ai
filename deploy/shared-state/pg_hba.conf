# The shared state's client authentication (spec 001 contracts/shared-state.md §1, §2): the superuser on the container's
# own socket alone, by its user; the four roles over TCP with TLS alone, by SCRAM-SHA-256. Nothing else matches, so any
# other connection is refused.
local   all     postgres                     peer
hostssl h4reet  gateway     all              scram-sha-256
hostssl h4reet  grafana_ro  all              scram-sha-256
hostssl h4reet  relay_ro    all              scram-sha-256
hostssl h4reet  relay_rw    all              scram-sha-256
