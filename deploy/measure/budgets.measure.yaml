# MEASUREMENT ONLY (tasks.md T166): stand-in public-cap figures, not the Author's; prod never reads this file.
# config/budgets.yaml's values, and a public section with stand-in figures, which P-6 leaves blank for the
# Author. The measurement's overlay (deploy/measure/tunnel-end.overlay.yaml) binds it at the relay's budgets path for
# the run alone; deploy/scripts/test_measure_tunnel_end.py holds it to config/budgets.yaml, and holds every prod file
# and host's class from naming it. The harness prints, before the run, that the relay's cap is these stand-ins.
schema: 1

timing:
  timezone: UTC
  reservation_ttl_s: 120

envs:
  prod: # the only class that spends real money (FR-031)
    daily_usd: 5.00
    monthly_usd: 20.00
    fallback_daily_usd: 2.00 # per grant; a renewal grants a fresh $2 inside the daily ceiling (FR-030)
    warn_ratio: 0.70
    adapter_monthly_usd: { anthropic: 20.00 } # the whole $20 ceiling, the Author's "$20 a month" (spec 010, FR-021)
  dev: # dev and dev-cpu: the same thresholds, applied to synthetic spend (FR-036)
    daily_usd: 5.00
    monthly_usd: 20.00
    fallback_daily_usd: 2.00
    warn_ratio: 0.70
    adapter_monthly_usd: { anthropic: 20.00 } # rule B8: dev equals prod; inert, since dev builds no paid adapter

limits:
  per_client: { requests_per_minute: 20, burst: 5, requests_per_day: 500, metered_in_flight: 1 }
  global: { metered_in_flight: 4, metered_per_minute: 60 }
  per_call: { max_input_chars: 2000, hello_max_output_tokens: 128, max_output_tokens: 512 }
  # The twin's per-turn limits (spec 007 FR-027; ADR 0040), the Author's patch P-2: a visitor turn's characters, the
  # turns and characters of conversation a request carries, a twin call's input bound (also its reservation's), and
  # its output cap.
  twin:
    {
      turn_max_chars: 600,
      history_max_turns: 8,
      history_max_chars: 4000,
      max_input_chars: 32000,
      max_output_tokens: 300,
    }

# The relay's public request cap, for the measurement alone: stand-ins at spec 000's per-client figures and the
# gateway's global metered in-flight limit, not the Author's (P-6; tasks.md T114).
public:
  per_address:
    requests_per_minute: 20
    burst: 5
    requests_per_day: 500
  global:
    in_flight: 4
