# MEASUREMENT ONLY (tasks.md T166): the shared state's client rules for the tunnel end's measurement, which runs
# without TLS, since nothing outside the measurement's own network reaches it and TLS's memory is not what T166
# records (plan.md §16, "T166's harness"). Prod reads deploy/shared-state/pg_hba.conf, hostssl alone.
local   all     postgres                     peer
host    h4reet  relay_ro    all              scram-sha-256
host    h4reet  relay_rw    all              scram-sha-256
