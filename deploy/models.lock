# The models the stacks serve, pinned by revision and sha256 (spec 000 FR-014, FR-019, FR-021; plan §3; research.md
# R-03; ADR 0019). A model change is a line here plus the stack's MODEL_FILE and MODEL_ALIAS, never a code change.
#
# One model per line, whitespace-separated, with its file name and sha256 on that same line, as preflight
# (deploy/scripts/preflight.py), deploy/scripts/pull-models.sh, and deploy/agents-engine/engine.sh seed read it:
#   id        the entry's name
#   alias     the server's --alias, which the stack's MODEL_ALIAS must equal (preflight P7)
#   repo      the Hugging Face repository
#   revision  the commit the file is fetched at: https://huggingface.co/<repo>/resolve/<revision>/<file>
#   file      the GGUF file, which the stack's MODEL_FILE names
#   sha256    the file's hash: pull-models.sh keeps no download that doesn't match it, and engine.sh seed copies no
#             model it can't verify against it
#   bytes     the file's size (preflight P13 and P18)
#   license   the model's license
#   vram      what the model needs on the GPU at the stack's context, in MiB or GiB (preflight P12)
#   stacks    the stacks that serve it, comma-separated
#
# The first pin is trust on first use: the Author checks each sha256 against the file's page before committing.
# The prod model's VRAM is plan §3's estimate until the first stack task measures it (research.md R-03).
#
# id                              alias                        repo                                      revision                                  file                                     sha256                                                            bytes        license     vram     stacks
