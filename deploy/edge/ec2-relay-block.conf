# EC2's two doors from the tunnel end (spec 001 contracts/tunnel.md §4; deploy/compose.yaml's ec2-relay-block): bytes
# forwarded as they come, with nothing read, rewritten, or logged but each connection's time and outcome. The relay
# block itself, its bearer token and its routes, is edge's 8085 (deploy/edge/nginx.conf); the collector's is
# otel-collector's 4318. Both upstreams are resolved per connection through Docker's resolver, so the forwarder starts
# whether or not they are up.

worker_processes 1;
pid /tmp/nginx.pid;
error_log stderr warn;

events {
  worker_connections 256;
}

stream {
  resolver 127.0.0.11 valid=10s ipv6=off;
  log_format doors '$time_iso8601 $server_port $status $session_time';
  access_log /dev/stdout doors;

  server {
    listen 8085;
    set $relay_block edge:8085;
    proxy_pass $relay_block;
    proxy_connect_timeout 5s;
  }

  server {
    listen 4318;
    set $collector otel-collector:4318;
    proxy_pass $collector;
    proxy_connect_timeout 5s;
  }
}
