# edge: the stack's only published door (spec 000, plan §1 and §2 "Edge"; contracts/gateway-http.md §1 and §6;
# contracts/operator-admin.md §1; contracts/telemetry.md §6.1). Mounted read-only at /etc/nginx/nginx.conf, so
# compose never interpolates it. Compose publishes the six listeners below on the stack's 127.0.0.1 ports:
#   8080 x000 api     -> gateway:8080, but /room/ (spec 002's usage events come through x005 only)
#   8081 x001 Langfuse -> langfuse-web:3000
#   8082 x002 Grafana -> grafana:3000
#   8083 x003 admin   -> gateway:8081
#   8084 x004 OTLP    -> otel-collector:4319, POST /v1/metrics only
#   8087 x005 site    -> web:8080, GET and HEAD; POST /api/room/events -> gateway:8080/room/events (spec 002);
#                        POST /api/room/turn -> gateway:8080/room/turn (spec 007)
# 8090 serves the health check and isn't published. 8085, 8086, and 8088 are spec 001's hosts' blocks, unpublished:
#   8085 relay     -> gateway:8080's /hello, /room/turn, /room/events, and /health/serving, behind the relay's token
#   8086 telemetry -> otel-collector:4318, POST /v1/{traces,metrics,logs}, behind its own token
#   8088 health    -> gateway:8080/health/serving, GET /health only, no token, no body

worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 512;
}

http {
  # The root filesystem is read-only; everything nginx writes goes to the /tmp tmpfs.
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  server_tokens off;
  sendfile off;

  # Docker's embedded DNS, asked per request (proxy_pass names a variable), so edge starts with no dependency on
  # any upstream, and a service that doesn't exist yet only fails its own requests.
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 2s;

  # No payloads and no client identifiers: the time, the listener, the request ID (the same one the gateway
  # receives, so the two logs correlate), the method, the path without its query string, the status, and the
  # duration. Never the client's address, a header, or a body.
  log_format h4 '$time_iso8601 $server_port $request_id $request_method $uri $status $request_time';
  access_log /dev/stdout h4;

  proxy_http_version 1.1;
  proxy_buffering off;
  proxy_request_buffering on;

  # Grafana Live needs WebSocket upgrades; everything else gets a plain keep-alive-free request.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    "" "";
  }

  # The room's usage events (spec 002, contracts/room-events.md §2): one zone per stack, keyed by the listener, since
  # every visitor's address on the local tier is the loopback. Over the rate, 429.
  limit_req_zone $server_port zone=room_events:1m rate=10r/s;
  # The twin's turns (spec 007, plan §2): one zone per stack too, a turn a second with a burst of five, before the
  # gateway's own per-client cap.
  limit_req_zone $server_port zone=room_turn:1m rate=1r/s;
  # Spec 001's health block (8088): Route 53's checkers, ten a second.
  limit_req_zone $server_port zone=health_block:1m rate=10r/s;
  limit_req_status 429;

  # Spec 001's hosts' blocks' two token maps, $h4_relay_authorized and $h4_telemetry_authorized, which
  # deploy/edge/entrypoint.sh writes to edge's tmpfs from its environment before nginx starts.
  include /tmp/h4-blocks/tokens.conf;

  # x000, the api: the gateway's /hello, /health/live, and /health.
  server {
    listen 8080;
    client_max_body_size 16k;

    location / {
      set $upstream gateway:8080;
      proxy_pass http://$upstream;
      proxy_set_header Host $http_host;
      # The client's identity is edge's view of it: any X-Forwarded-For the client sent is replaced, and the
      # other forwarding headers are dropped, so a client can't claim another address.
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Real-IP "";
      proxy_set_header Forwarded "";
      proxy_set_header X-Forwarded-Host "";
      proxy_set_header X-Forwarded-Proto "";
      # The request ID is edge's, overwriting any the client sent (gateway-http.md §1).
      proxy_set_header X-Request-Id $request_id;
      # A client may neither switch off sampling for its own call nor choose the trace ID the ledger records:
      # the gateway starts every hello trace itself (gateway-http.md §1).
      proxy_set_header traceparent "";
      proxy_set_header tracestate "";
      proxy_set_header baggage "";
      proxy_set_header Connection "";
      # Longer than the gateway's 20 s request deadline, so edge never cuts a request the gateway would answer.
      proxy_connect_timeout 2s;
      proxy_read_timeout 30s;
      proxy_send_timeout 30s;
    }

    # Spec 002's usage events reach the gateway only through x005's /api/room/events, with its rate limit and
    # 512-byte cap (room-events.md §2). Here the room's routes don't exist, as the gateway answers an unknown route.
    location /room/ {
      default_type application/json;
      add_header Cache-Control no-store always;
      add_header X-Content-Type-Options nosniff always;
      add_header X-Request-Id $request_id always;
      return 404 '{"error":"not_found","request_id":"$request_id"}';
    }

    # Errors nginx makes itself: the gateway refused the connection, its name didn't resolve, or it timed out.
    # proxy_intercept_errors stays off, so the gateway's own 502 local_error and 503 answers pass unchanged.
    error_page 502 504 = @api_unavailable;
    error_page 413 = @body_too_large;

    location @api_unavailable {
      default_type application/json;
      add_header X-H4-Degraded-Cause api_unavailable always;
      add_header Cache-Control no-store always;
      add_header X-Content-Type-Options nosniff always;
      add_header X-Request-Id $request_id always;
      return 503 '{"state":"degraded","cause":"api_unavailable","detail":"The gateway is not answering. The stack edge proxy answered instead.","ceilings":null,"stack":null,"since":null,"request_id":"$request_id","trace_id":null}';
    }

    location @body_too_large {
      default_type application/json;
      add_header Cache-Control no-store always;
      add_header X-Content-Type-Options nosniff always;
      add_header X-Request-Id $request_id always;
      return 413 '{"error":"body_too_large","limit_bytes":16384}';
    }
  }

  # x001, Langfuse's web UI and API.
  server {
    listen 8081;
    client_max_body_size 1m;

    location / {
      set $upstream langfuse-web:3000;
      proxy_pass http://$upstream;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Real-IP "";
      proxy_set_header Forwarded "";
      proxy_set_header X-Forwarded-Host "";
      proxy_set_header X-Forwarded-Proto "";
      proxy_set_header X-Request-Id $request_id;
      proxy_set_header Connection "";
      proxy_connect_timeout 2s;
      proxy_read_timeout 60s;
    }
  }

  # x002, Grafana.
  server {
    listen 8082;
    client_max_body_size 1m;

    location / {
      set $upstream grafana:3000;
      proxy_pass http://$upstream;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Real-IP "";
      proxy_set_header Forwarded "";
      proxy_set_header X-Forwarded-Host "";
      proxy_set_header X-Forwarded-Proto "";
      proxy_set_header X-Request-Id $request_id;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_connect_timeout 2s;
      proxy_read_timeout 60s;
    }
  }

  # x003, the gateway's admin listener (contracts/operator-admin.md §1).
  server {
    listen 8083;
    client_max_body_size 4k;

    location / {
      set $upstream gateway:8081;
      proxy_pass http://$upstream;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Real-IP "";
      proxy_set_header Forwarded "";
      proxy_set_header X-Forwarded-Host "";
      proxy_set_header X-Forwarded-Proto "";
      proxy_set_header X-Request-Id $request_id;
      proxy_set_header traceparent "";
      proxy_set_header tracestate "";
      proxy_set_header baggage "";
      proxy_set_header Connection "";
      proxy_connect_timeout 2s;
      proxy_read_timeout 30s;
      proxy_send_timeout 30s;
    }

    error_page 502 504 = @admin_unavailable;
    error_page 413 = @body_too_large;

    location @admin_unavailable {
      default_type application/json;
      add_header Cache-Control no-store always;
      add_header X-Content-Type-Options nosniff always;
      add_header X-Request-Id $request_id always;
      return 503 '{"error":"admin_unavailable"}';
    }

    location @body_too_large {
      default_type application/json;
      add_header Cache-Control no-store always;
      add_header X-Content-Type-Options nosniff always;
      add_header X-Request-Id $request_id always;
      return 413 '{"error":"body_too_large","limit_bytes":4096}';
    }
  }

  # x004, dev-time metrics only (FR-037): POST /v1/metrics to the collector's own otlp/devtime receiver, so a
  # process on the host can't inject traces, logs, or series that look like the gateway's (telemetry.md §6.1).
  server {
    listen 8084;
    client_max_body_size 1m;

    location = /v1/metrics {
      if ($request_method != POST) {
        return 404;
      }
      set $upstream otel-collector:4319;
      proxy_pass http://$upstream;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header Connection "";
      proxy_connect_timeout 2s;
      proxy_read_timeout 10s;
    }

    location / {
      return 404;
    }
  }

  # x005, the room's site (spec 002; contracts/web-serving.md §2, room-events.md §2): the web service's static files,
  # GET and HEAD only; the usage-event beacon to the gateway, POST only, capped and rate-limited; the rest of /api/
  # answered 404 until the conversation endpoint exists; and edge's own page while web doesn't answer.
  server {
    listen 8087;
    client_max_body_size 1k;

    location / {
      limit_except GET {
        deny all;
      }
      set $upstream web:8080;
      proxy_pass http://$upstream;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Real-IP "";
      proxy_set_header Forwarded "";
      proxy_set_header X-Forwarded-Host "";
      proxy_set_header X-Forwarded-Proto "";
      proxy_set_header X-Request-Id $request_id;
      proxy_set_header Connection "";
      # web sets no cookie (contracts/web-serving.md §3); edge drops one if it ever did.
      proxy_hide_header Set-Cookie;
      proxy_connect_timeout 2s;
      proxy_read_timeout 30s;
      error_page 502 504 = @site_unavailable;
    }

    location = /api/room/events {
      limit_except POST {
        deny all;
      }
      limit_req zone=room_events burst=20 nodelay;
      client_max_body_size 512;
      set $upstream gateway:8080;
      proxy_pass http://$upstream/room/events;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Real-IP "";
      proxy_set_header Forwarded "";
      proxy_set_header X-Forwarded-Host "";
      proxy_set_header X-Forwarded-Proto "";
      proxy_set_header X-H4-Client "";
      proxy_set_header X-Request-Id $request_id;
      proxy_set_header traceparent "";
      proxy_set_header tracestate "";
      proxy_set_header baggage "";
      proxy_set_header Connection "";
      proxy_connect_timeout 2s;
      proxy_read_timeout 10s;
    }

    # The twin's turn (spec 007, FR-001, FR-028; plan §2): POST only, rate-limited per stack, 32 KiB, to the gateway's
    # POST /room/turn. A stopped gateway is a degraded turn of edge's own, which the room reads as "unavailable"; a body
    # over the cap is a JSON 413. The read timeout sits above the gateway's 20-second deadline and below the room's 35.
    location = /api/room/turn {
      limit_except POST {
        deny all;
      }
      limit_req zone=room_turn burst=5 nodelay;
      client_max_body_size 32k;
      set $upstream gateway:8080;
      proxy_pass http://$upstream/room/turn;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Real-IP "";
      proxy_set_header Forwarded "";
      proxy_set_header X-Forwarded-Host "";
      proxy_set_header X-Forwarded-Proto "";
      proxy_set_header X-H4-Client "";
      proxy_set_header X-Request-Id $request_id;
      proxy_set_header traceparent "";
      proxy_set_header tracestate "";
      proxy_set_header baggage "";
      proxy_set_header Connection "";
      proxy_connect_timeout 2s;
      proxy_read_timeout 30s;
      error_page 502 504 = @turn_unavailable;
      error_page 413 = @turn_too_large;
    }

    location /api/ {
      return 404;
    }

    location @turn_unavailable {
      default_type application/json;
      add_header X-H4-Degraded-Cause api_unavailable always;
      add_header Cache-Control no-store always;
      add_header X-Content-Type-Options nosniff always;
      add_header X-Request-Id $request_id always;
      return 503 '{"state":"degraded","cause":"api_unavailable","detail":"The gateway is not answering. The stack edge proxy answered instead.","ceilings":null,"stack":null,"since":null,"request_id":"$request_id","trace_id":null}';
    }

    location @turn_too_large {
      default_type application/json;
      add_header Cache-Control no-store always;
      add_header X-Content-Type-Options nosniff always;
      add_header X-Request-Id $request_id always;
      return 413 '{"error":"body_too_large","limit_bytes":32768}';
    }

    location @site_unavailable {
      default_type text/html;
      add_header Cache-Control no-store always;
      add_header X-Content-Type-Options nosniff always;
      add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'" always;
      add_header Referrer-Policy no-referrer always;
      add_header Permissions-Policy "microphone=(), camera=(), geolocation=()" always;
      return 503 '<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Unavailable</title></head><body><p>The room is unavailable right now.</p></body></html>';
    }
  }

  # Spec 001's hosts' blocks (its contracts/tunnel.md §4; research.md R-12; FR-053, FR-054), unpublished: the laptop's
  # tunnel reaches them from the tunnel end (-R 2201, 2202, and 2203), and EC2's relay block is published on its
  # private address (group 7). The two tokens' maps come from deploy/edge/entrypoint.sh, from edge's environment: with
  # no token, nothing matches, and both blocks answer 401.
  #
  # 8085, the relay block: the relay's four requests, behind the relay's bearer token for this host. It sends on the
  # one X-Forwarded-For the relay gave it as X-H4-Viewer, drops every other forwarding header and the token, and keeps
  # the trace context, so the gateway's spans are the relay's children. Its 401s and everything else are logged in the
  # stack's format, which holds no address.
  server {
    listen 8085;
    client_max_body_size 32k;

    location = /hello {
      if ($h4_relay_authorized != 1) {
        return 401 "";
      }
      limit_except POST {
        deny all;
      }
      client_max_body_size 16k;
      set $upstream gateway:8080;
      proxy_pass http://$upstream/hello;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $http_x_h4_viewer;
      proxy_set_header X-H4-Viewer "";
      proxy_set_header Authorization "";
      proxy_set_header X-Real-IP "";
      proxy_set_header Forwarded "";
      proxy_set_header X-Forwarded-Host "";
      proxy_set_header X-Forwarded-Proto "";
      proxy_set_header X-Request-Id $request_id;
      proxy_set_header Connection "";
      proxy_connect_timeout 2s;
      proxy_read_timeout 30s;
      proxy_send_timeout 30s;
    }

    location = /room/turn {
      if ($h4_relay_authorized != 1) {
        return 401 "";
      }
      limit_except POST {
        deny all;
      }
      client_max_body_size 32k;
      set $upstream gateway:8080;
      proxy_pass http://$upstream/room/turn;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $http_x_h4_viewer;
      proxy_set_header X-H4-Viewer "";
      proxy_set_header Authorization "";
      proxy_set_header X-Real-IP "";
      proxy_set_header Forwarded "";
      proxy_set_header X-Forwarded-Host "";
      proxy_set_header X-Forwarded-Proto "";
      proxy_set_header X-Request-Id $request_id;
      proxy_set_header Connection "";
      proxy_connect_timeout 2s;
      proxy_read_timeout 30s;
      proxy_send_timeout 30s;
    }

    location = /room/events {
      if ($h4_relay_authorized != 1) {
        return 401 "";
      }
      limit_except POST {
        deny all;
      }
      client_max_body_size 512;
      set $upstream gateway:8080;
      proxy_pass http://$upstream/room/events;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $http_x_h4_viewer;
      proxy_set_header X-H4-Viewer "";
      proxy_set_header Authorization "";
      proxy_set_header X-Real-IP "";
      proxy_set_header Forwarded "";
      proxy_set_header X-Forwarded-Host "";
      proxy_set_header X-Forwarded-Proto "";
      proxy_set_header X-Request-Id $request_id;
      proxy_set_header Connection "";
      proxy_connect_timeout 2s;
      proxy_read_timeout 10s;
    }

    # The relay's health check of this host, every second: the gateway answers and the store reads, 200, or 503, each
    # with no body; a gateway that doesn't answer is 503 too.
    location = /health {
      if ($h4_relay_authorized != 1) {
        return 401 "";
      }
      limit_except GET {
        deny all;
      }
      set $upstream gateway:8080;
      proxy_pass http://$upstream/health/serving;
      proxy_pass_request_body off;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $http_x_h4_viewer;
      proxy_set_header X-H4-Viewer "";
      proxy_set_header Authorization "";
      proxy_set_header X-Real-IP "";
      proxy_set_header Forwarded "";
      proxy_set_header X-Forwarded-Host "";
      proxy_set_header X-Forwarded-Proto "";
      proxy_set_header X-Request-Id $request_id;
      proxy_set_header Connection "";
      proxy_connect_timeout 1s;
      proxy_read_timeout 2s;
      error_page 502 504 =503 @relay_health_down;
    }

    location @relay_health_down {
      return 503 "";
    }

    location / {
      return 404;
    }
  }

  # 8086, the telemetry block (the laptop's alone): the tunnel end's collector's OTLP export, behind its own token, to
  # the stack's collector, whose redaction runs on it as on the gateway's own.
  server {
    listen 8086;
    client_max_body_size 4m;

    location ~ ^/v1/(traces|metrics|logs)$ {
      if ($h4_telemetry_authorized != 1) {
        return 401 "";
      }
      limit_except POST {
        deny all;
      }
      set $upstream otel-collector:4318;
      proxy_pass http://$upstream;
      proxy_set_header Host $http_host;
      proxy_set_header Authorization "";
      proxy_set_header X-Forwarded-For "";
      proxy_set_header Connection "";
      proxy_connect_timeout 2s;
      proxy_read_timeout 10s;
    }

    location / {
      return 404;
    }
  }

  # 8088, the health block (the laptop's alone): Route 53's checkers, through the tunnel end's public 8087 and the
  # tunnel's 2203, with no token, since they can't send one (FR-053). It says only whether the laptop serves: 200 or
  # 503, with no body, rate-limited. The contract's 8087 is the tunnel end's port; on edge, 8087 is spec 002's site.
  server {
    listen 8088;
    access_log off;

    location = /health {
      limit_except GET {
        deny all;
      }
      limit_req zone=health_block burst=10 nodelay;
      set $upstream gateway:8080;
      proxy_pass http://$upstream/health/serving;
      proxy_pass_request_body off;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For "";
      proxy_set_header Connection "";
      proxy_connect_timeout 1s;
      proxy_read_timeout 2s;
      error_page 502 504 =503 @health_down;
    }

    location @health_down {
      return 503 "";
    }

    location / {
      return 404;
    }
  }

  # The health check (compose: wget http://127.0.0.1:8090/ping). Not published.
  server {
    listen 8090;
    access_log off;

    location = /ping {
      default_type text/plain;
      return 200 "ok\n";
    }

    location / {
      return 404;
    }
  }
}
