# ens5, the private interface: what came in by it is answered by it (spec 001, fix F2; specs/001-cloud-elevation/
# fixes/f2.md). The relay's 8080, the shared state's 5432, and the sink's 2301 are Docker's ports on 10.42.1.10, and
# their replies are routed from Docker's bridges before their source is 10.42.1.10 again, so main's table sent those to
# 10.42.0.0/24, CloudFront's VPC origin's subnet, out ens6, which drops them. The Author's lines of the deploy's night:
# table 105's default by ens5's DHCP gateway (10.42.1.1); the host's own replies from the private address, at 105; and
# every packet h4-reply-route.nft marks 0x105 (a connection that came in by ens5), at 104. FirewallMark is 0x105 in
# decimal, which every systemd reads. From the release's tree, by the deployer's host step (shared_state.py prepare),
# so a change here is a release, never a replace; networkd makes them at each boot.
[Route]
Gateway=_dhcp4
Table=105

[RoutingPolicyRule]
From=10.42.1.10
Table=105
Priority=105

[RoutingPolicyRule]
FirewallMark=261
Table=105
Priority=104
