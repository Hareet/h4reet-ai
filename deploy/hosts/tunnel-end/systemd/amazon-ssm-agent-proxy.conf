# The Systems Manager agent through the egress proxy, since nftables lets no other process out (spec 001 FR-050,
# FR-051). The instance metadata stays direct, for the agent's credentials.
[Service]
Environment=https_proxy=http://127.0.0.1:3128 HTTPS_PROXY=http://127.0.0.1:3128 no_proxy=169.254.169.254 NO_PROXY=169.254.169.254
