# Docker's data root is the data volume's mount (deploy/hosts/ec2/daemon.json): with the volume missing, Docker doesn't
# start, rather than write the stack's stores to the root volume (cloud-init's boot command mounts it). The boot's hand
# mount has no unit, so RequiresMountsFor= orders alone: mountpoint itself fails the start. And Docker requires the
# packet filter, so with no h4reet table no container's 443 goes out past the proxy (group 7's review B, I1 and I2).
[Unit]
RequiresMountsFor=/srv/h4reet/data
Requires=h4-nftables.service
After=h4-nftables.service h4-egress-proxy.service

[Service]
ExecStartPre=/usr/bin/mountpoint -q /srv/h4reet/data
