# Weekly update pull requests for npm, pip, GitHub Actions, and Dockerfile base images: the constitution asks for
# lockfile-pinned dependencies with automated updates. Not covered yet: images pinned in compose files, Terraform
# providers, and devcontainer features. Automated updates now belong to the publication spec (spec 000 Clarifications,
# 2026-10-07), which decides those. Takes effect at publication (ADR 0013), when Dependabot is enabled.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)

  # Updates the SHA pins of CI actions, and the version comments next to them.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)

  # Base images in the Dockerfiles, wherever spec 000's plan puts them.
  - package-ecosystem: docker
    directories:
      - /
      - /apps/*
      - /services/*
      - /deploy
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
