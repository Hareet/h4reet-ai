# The fixture visitor's figure: the chosen avatar draws it, so the piece gives the stand-in, the size, and the hand.
version: 1
id: fx-visitor
name: Fixture visitor figure
size: { w: 0.2, h: 0.5, d: 0.15 }
origin:
  point: Fixture point between the visitor's feet
  bounds: { min: [-0.1, 0, -0.075], max: [0.1, 0.5, 0.075] }
anchors:
  hand: { at: [0.1, 0.25, 0.05] }
standin:
  - { shape: capsule, radius: 0.07, length: 0.3, at: [0, 0.25, 0], color: fx-skin }
  - { shape: sphere, radius: 0.04, at: [0, 0.45, 0], color: fx-skin }
drawing: { from: standin }
budget: { gzip_bytes: 100000, triangles: 1000, texture_px: 256, texture_bytes: 349525 }
work_order:
  method: Fixture method for the visitor's stand-in
  shots: [Fixture shot of the visitor figure]
  measurements: [Fixture measure of the visitor figure]
  studio_notes: Fixture studio notes for the visitor
