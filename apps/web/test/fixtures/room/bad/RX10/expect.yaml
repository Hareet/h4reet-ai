rule: RX10
file: assets/room/fx-desk.glb
path: materials[0].emissiveFactor
why: an emissive factor, light baked into a material
generate: { assets/room/fx-desk.glb: glb:rx10-emissive-factor, assets/room/records.json: records }
edits:
  - file: apps/web/room/catalog/fx-desk.yaml
    at: [origin, bounds]
    set: { min: [-0.8, 0, -0.4], max: [0.8, 0.75, 0.4] }
  - { file: apps/web/room/catalog/fx-desk.yaml, at: [model], set: { file: fx-desk.glb } }
