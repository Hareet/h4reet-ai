rule: RX3
file: assets/room/fx-desk.glb
path: nodes[1].camera
why: a camera on a node, which a room model never carries
generate: { assets/room/fx-desk.glb: glb:rx3-camera, assets/room/records.json: records }
edits:
  - file: apps/web/room/catalog/fx-desk.yaml
    at: [origin, bounds]
    set: { min: [-0.8, 0, -0.4], max: [0.8, 0.75, 0.4] }
  - { file: apps/web/room/catalog/fx-desk.yaml, at: [model], set: { file: fx-desk.glb } }
