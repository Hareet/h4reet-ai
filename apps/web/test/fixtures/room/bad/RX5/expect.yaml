rule: RX5
file: assets/room/fx-desk.glb
path: extensions
why: a model without spec 003's mark, not scrubbed
generate: { assets/room/fx-desk.glb: glb:rx5-not-scrubbed, assets/room/records.json: records }
edits:
  - file: apps/web/room/catalog/fx-desk.yaml
    at: [origin, bounds]
    set: { min: [-0.8, 0, -0.4], max: [0.8, 0.75, 0.4] }
  - { file: apps/web/room/catalog/fx-desk.yaml, at: [model], set: { file: fx-desk.glb } }
