# The web image's nginx (spec 002, plan §1 and §9; contracts/web-serving.md §1 and §3): the room's built site,
# read-only, on 8080, inside the stack's internal network. The stack's edge publishes it on x005 (deploy/edge/
# nginx.conf, listener 8087), and later spec 001's edge serves the same files with the same headers.

worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 256;
}

http {
  # The root filesystem is read-only; everything nginx writes goes to the /tmp tmpfs.
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  sendfile on;
  charset utf-8;
  charset_types text/css application/javascript application/json text/plain;

  # The method, the path without its query string, the status, and the duration, with the time: never the client's
  # address, a header, or a body.
  log_format h4web '$time_iso8601 $request_method $uri $status $request_time';
  access_log /dev/stdout h4web;

  # Hashed assets never change under their name; every other file is revalidated (contracts/web-serving.md §3).
  map $uri $h4_cache {
    ~^/assets/ "public, max-age=31536000, immutable";
    default "no-cache";
  }

  server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 1k;

    # Every response, errors included, carries these, and nothing below adds a header of its own, which would
    # replace them (contracts/web-serving.md §3). The microphone stays () until push-to-talk's group builds capture.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "microphone=(), camera=(), geolocation=()" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control $h4_cache always;

    location / {
      limit_except GET {
        deny all;
      }
      try_files $uri $uri/ =404;
    }

    # The PDF's text file is the gate's, never the visitor's: the image leaves it out, and this refuses it anyway.
    location ~ \.pdf\.txt$ {
      return 404;
    }

    # The health check (compose: wget http://127.0.0.1:8080/healthz): a static file the Dockerfile writes.
    location = /healthz {
      access_log off;
      default_type text/plain;
    }
  }
}
