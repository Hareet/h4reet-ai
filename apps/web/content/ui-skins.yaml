# The interface's button skins (spec 030, FR-009; plan.md §R-B1). Features as data: a swap is an edit of `active`, or
# of a skin's tokens, never of code. build/ui-skins.ts reads this file at build into custom properties on
# :root[data-skin="<id>"] (FR-010), which src/ui/button.css alone reads. Colours are #rrggbb or rgb(r g b / a); lengths
# take px, rem, or em. Each state's face, label, and border; the selected state's glow; each variant's focus ring,
# drawn inside the face. Every value is an estimate for the Author's look (SC-008), held to FR-012's ratios by
# test/ui-skins.test.ts; a token that failed one was moved in 5% steps of lightness, each move recorded in plan §R-B1.
active: metal
skins:
  # Dark brushed metal in the spirit of his reference, drawn from its description alone: chamfered corners, a bevel and
  # an inner highlight, a dark frame, yellow for the primary action, cyan for the rest, the selected one glowing.
  metal:
    kind: css
    tokens:
      font: { family: "IBM Plex Sans", weight: 700, case: upper, tracking: 0.06em }
      chamfer: 0.5rem
      radius: 0rem
      frame: "#2a3038"
      bevel: { light: "rgb(255 255 255 / 0.28)", dark: "rgb(0 0 0 / 0.55)" }
      highlight: "rgb(255 255 255 / 0.18)"
      glow: { radius: 0.5rem }
      primary:
        ring: "#14171c"
        normal: { face: "#f2c230", label: "#14171c", border: "#312500" }
        hover: { face: "#ffd54d", label: "#14171c", border: "#7d5f00" }
        pressed: { face: "#c99a14", label: "#14171c", border: "#312500" }
        disabled: { face: "#ac9863", label: "#14171c", border: "#312500" }
        selected: { face: "#f2c230", label: "#14171c", border: "#312500", glow: "#ffd23f" }
      secondary:
        ring: "#ffd23f"
        normal: { face: "#16323c", label: "#e6fbff", border: "#76e1f4" }
        hover: { face: "#1d4250", label: "#ffffff", border: "#76e1f4" }
        pressed: { face: "#0e2129", label: "#e6fbff", border: "#46d7f0" }
        disabled: { face: "#1a2226", label: "#c4cdd1", border: "#8b979d" }
        selected: { face: "#16323c", label: "#ffffff", border: "#76e1f4", glow: "#46d7f0" }
  # Plain, to prove the swap: a flat face, a 1 px border, square corners, no glow, the words' own case.
  plain:
    kind: css
    tokens:
      font: { family: "IBM Plex Sans", weight: 400, case: as-written, tracking: 0em }
      chamfer: 0rem
      radius: 0rem
      frame: "#10141a"
      bevel: { light: "rgb(255 255 255 / 0.2)", dark: "rgb(0 0 0 / 0.4)" }
      highlight: "rgb(255 255 255 / 0)"
      glow: { radius: 0rem }
      primary:
        ring: "#10141a"
        normal: { face: "#e8e4dc", label: "#10141a", border: "#10141a" }
        hover: { face: "#ffffff", label: "#10141a", border: "#10141a" }
        pressed: { face: "#cfcac0", label: "#10141a", border: "#10141a" }
        disabled: { face: "#b9b5ad", label: "#10141a", border: "#10141a" }
        selected: { face: "#e8e4dc", label: "#10141a", border: "#10141a", glow: "#10141a" }
      secondary:
        ring: "#ffd23f"
        normal: { face: "#10141a", label: "#ffffff", border: "#c8ccd2" }
        hover: { face: "#262c35", label: "#ffffff", border: "#e8e4dc" }
        pressed: { face: "#05070a", label: "#ffffff", border: "#c8ccd2" }
        disabled: { face: "#10141a", label: "#b8bec6", border: "#939aa3" }
        selected: { face: "#10141a", label: "#ffffff", border: "#ffd23f", glow: "#ffd23f" }
