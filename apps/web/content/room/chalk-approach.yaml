    about_author: true
    claims:
      - file: corpus/01-ai-strategy-and-cht.md
        quote: "The through-line is AI for good: production-grade rigor from an SRE background"
  - text: judged by its ability to help CHWs
    about_author: true
    claims:
      - file: corpus/01-ai-strategy-and-cht.md
        quote: "human-centered, judged by its ability to help CHWs"
  - text: shared tools, shared standards, shared learning
    about_author: true
    claims:
      - file: corpus/01-ai-strategy-and-cht.md
        quote: "organizational AI, not individual AI — shared tools, shared standards, shared learning"
  - text: "PLACEHOLDER for the Author: how the Author approaches a problem, in the Author's own words, once the corpus holds them"
    pending: true
