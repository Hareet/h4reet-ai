# How the Author thinks about problems, on the chalkboard (spec 004; FR-030, FR-033, FR-035; T189): a draft, as
# chalk-mission.yaml is. Each drawn line is the corpus's own words, a span of the sentence its claim quotes, the quote
# the longer span. The pending line is a placeholder for the Author, never drawn or published: the corpus holds no
# sentence yet in which the Author says how he approaches a problem, so the lines here are the principles it records.
version: 1
block: chalk-approach
renderer: chalk
exclude: [Seva, selfless service, service to humanity, cultural tradition]
lines:
