  - { shape: tube, from: [-0.03, 0, 0], to: [0.23, 0.33, 0], radius: 0.018, at: [0, 0, 0], color: bike-red }
  - { shape: tube, from: [0.23, 0.33, 0], to: [0.377, 0, 0], radius: 0.018, at: [0, 0, 0], color: bike-red }
  - { shape: box, size: [0.14, 0.03, 0.06], at: [-0.15, 0.37, 0], color: ink }
