  primitives:
    - { primitive: circle, cx: -0.377, cy: 0, r: 0.238, stroke: "#333333", stroke_width: 0.042 }
    - { primitive: circle, cx: 0.377, cy: 0, r: 0.238, stroke: "#333333", stroke_width: 0.042 }
    - primitive: polyline
      points: [[-0.377, 0], [-0.13, 0.33], [0.23, 0.33], [0.377, 0], [-0.03, 0], [-0.377, 0]]
      stroke: "#333333"
      stroke_width: 0.042
    - { primitive: line, x1: -0.03, y1: 0, x2: -0.142, y2: 0.37, stroke: "#333333", stroke_width: 0.042 }
    - { primitive: line, x1: 0.23, y1: 0.33, x2: 0.2, y2: 0.4, stroke: "#333333", stroke_width: 0.042 }
budget: { gzip_bytes: 1500000, triangles: 89000, texture_px: 2048, texture_bytes: 6990506 }
work_order:
  method: >-
    Model the bicycle from the dimension sheet and the Author's description: the wheels, the frame, the saddle, and
    the handlebars as clean solid parts, with no cables.
  shots:
    - The bicycle in profile from its drive side, square on, the whole bicycle in frame.
    - The bicycle from the front, square on.
    - The frame's joints close up, for their shape.
  measurements:
    - The wheelbase, from hub to hub, and each wheel's diameter.
    - The frame's height at the saddle and at the handlebars, and the handlebars' width.
    - Where the hook it hangs from is, from the floor and from the back wall.
  studio_notes: >-
    No brand, decal, model name, or tyre-wall text anywhere (FR-016); the frame is one plain colour or an original
    pattern.
