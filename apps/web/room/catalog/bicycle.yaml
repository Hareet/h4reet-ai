# The bicycle (W1's right side; FR-078: hanging next to the desk): spec 002's placeholder, two wheels, a frame of
# tubes, a saddle, and handlebars (src/room/scene.ts), hung upright by its front wheel, flat on the cube's right wall,
# next to the laptop (the Author, 2026-10-23: "along a brick wall that is the right side of the cube, next to the
# laptop"). Its size and where it hangs are estimates until measured; the bounds hold the wheels. The size and bounds
# are the studio's hand-back of 2026-11-07 for the Author's lookdev bike ("The lookdev's road bike, at 0.77"), whose
# wheels are 0.259 m, centred at (±0.377, 0): the stand-in's and the drawing's wheels moved there, with the frame's
# stays and fork, so both stay inside the bounds (RG2); the rest of spec 002's frame stays.
