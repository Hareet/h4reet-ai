# The desk sign "I am very busy" (FR-032; answer 4): the Author's own design, a solid purple A-frame whose front leans
# back 12.16°, as the studio's hand-back of 2026-11-07 gives it (tasks.md T313). Its lettering area, on that slope, is
# a readable live face, drawn live from its approved outline once the outline arrives (T202); until then it stays
# plain. The face's centre and size are the hand-back's, given at the model's scale, divided by the stylized scale,
# since the catalog's figures are at scale 1 and the work order multiplies them back (contracts/room-data-files.md §2);
# its facing and up are the slope's, (0, sin 12.16°, cos 12.16°) and (0, cos 12.16°, −sin 12.16°) to 7 places, since
# the hand-back's 4 places miss a unit vector by 2.7e-5 and RG2 holds one within 1e-6; its canvas keeps the face's
# aspect. The stand-in stays a plate on a foot, in the sign's purple. Its size and where it stands are estimates until
# measured; the stylized scale is lookdev's to set.
version: 1
id: busy-sign
name: "Desk sign: I am very busy"
size: { w: 0.22, h: 0.09, d: 0.05, estimated: true }
stylized_scale: 1.5
origin:
  point: on the desk, below the centre of the sign's foot.
  bounds: { min: [-0.11, 0, -0.025], max: [0.11, 0.09, 0.025] }
live_faces:
  - role: lettering
    at: [0, 0.0502, 0.0172]
    size: [0.192, 0.0613333]
    facing: [0, 0.2106424, 0.9775632]
    up: [0, 0.9775632, -0.2106424]
    px: [1024, 327]
    readable: true
standin:
  - { shape: box, size: [0.22, 0.02, 0.05], at: [0, 0.01, 0], color: sign-purple }
  - { shape: box, size: [0.22, 0.07, 0.008], at: [0, 0.055, 0], color: sign-purple }
drawing: { from: standin }
budget: { gzip_bytes: 150000, triangles: 1500, texture_px: 1, texture_bytes: 1 }
work_order:
  method: >-
    Model the sign's shape from the Author's own design and the dimension sheet. The lettering area is one quad, the
    live face named for its role, in one plain colour: the room draws the words from their approved outline.
  shots:
    - The sign from the front, square on.
    - The sign from its side, showing its foot and thickness.
  measurements:
    - The sign's width, height, and thickness, and its foot's depth.
    - The lettering area's width and height, and its position on the face.
    - Where the sign stands on the desk, from the desk's front-left corner.
  studio_notes: >-
    The Author's own design (answer 4): its non-word graphics may stay in the texture, but no letter of its lettering
    may (FR-016, FR-032). The lettering's outline comes to the room separately, never through the studio's textures.
