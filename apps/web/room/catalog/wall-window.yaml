# The window (FR-078): a frame of four bars set in the back wall, spec 002's placeholder at the size estimated for the
# Author's window until measured. Its view, a fence and a tree, is a piece of its own mounted inside it.
version: 1
id: wall-window
name: Window
size: { w: 0.7, h: 0.5, d: 0.06, estimated: true }
stylized_scale: 1
origin:
  point: the centre of the window's opening, in the plane of the wall.
  bounds: { min: [-0.35, -0.25, 0], max: [0.35, 0.25, 0.06] }
anchors:
  view: { at: [0, 0, 0.01], estimated: true }
standin:
  - { shape: box, size: [0.7, 0.04, 0.06], at: [0, 0.23, 0.03], color: frame-wood }
  - { shape: box, size: [0.7, 0.04, 0.06], at: [0, -0.23, 0.03], color: frame-wood }
  - { shape: box, size: [0.04, 0.5, 0.06], at: [-0.33, 0, 0.03], color: frame-wood }
  - { shape: box, size: [0.04, 0.5, 0.06], at: [0.33, 0, 0.03], color: frame-wood }
drawing: { from: standin }
budget: { gzip_bytes: 300000, triangles: 2000, texture_px: 512, texture_bytes: 1398101 }
work_order:
  method: Model the window's frame from the dimension sheet and the Author's description, with an empty opening.
  shots:
    - The window's frame from inside, square on, with the blind or curtain closed, so no view shows through it.
  measurements:
    - The opening's width and height, and the frame's width and depth.
    - Where the window is, from the floor to the opening's lower edge and from the room's right side.
  studio_notes: >-
    The frame only: the view through it is the window view's own model, a generic fence and a generic tree with no
    building, skyline, landmark, sign, or street (FR-028). No handle brand, label, or sticker (FR-016).
