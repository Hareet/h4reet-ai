# The window (FR-078): a frame of four bars set in the back wall, large, behind the monitor and the neon sign (the
# Author, 2026-10-23: "The window is large and should encompass around the neon sign"), at a size estimated until
# measured. Its view, a fence and a tree, is a piece of its own mounted inside it.
version: 1
id: wall-window
name: Window
size: { w: 1.8, h: 1.25, d: 0.06, estimated: true }
stylized_scale: 1
origin:
  point: the centre of the window's opening, in the plane of the wall.
  bounds: { min: [-0.9, -0.625, 0], max: [0.9, 0.625, 0.06] }
anchors:
  view: { at: [0, 0, 0.01], estimated: true }
standin:
  - { shape: box, size: [1.8, 0.04, 0.06], at: [0, 0.605, 0.03], color: frame-wood }
  - { shape: box, size: [1.8, 0.04, 0.06], at: [0, -0.605, 0.03], color: frame-wood }
  - { shape: box, size: [0.04, 1.25, 0.06], at: [-0.88, 0, 0.03], color: frame-wood }
  - { shape: box, size: [0.04, 1.25, 0.06], at: [0.88, 0, 0.03], color: frame-wood }
drawing: { from: standin }
budget: { gzip_bytes: 300000, triangles: 2000, texture_px: 512, texture_bytes: 1398101 }
work_order:
  method: >-
    Model the window's frame from the dimension sheet, with an empty opening. The window is the room's composition, as
    the Author laid out the cube (FR-078): large, around the neon sign, at the size and place the scene gives it. It
    copies no real window, so there is nothing to photograph.
  shots: []
  measurements:
    - The frame's width and depth, if the Author wants them closer to a frame they know.
  studio_notes: >-
    The frame only: the view through it is the window view's own model, a generic fence and a generic tree with no
    building, skyline, landmark, sign, or street (FR-028). No handle brand, label, or sticker (FR-016).
