# The clip-on neon arrow sign on the monitor's top edge (FR-021, FR-046; answer 6): an arrow-shaped backing, the neon
# tube tracing its outline, and the clip that grips the edge, with no tube shaped like a letter or a digit. Its four
# live faces are plain panels the room draws on: the word, the two counters, and the second line (FR-049), which isn't
# a readable face, so its words go to the text copy (FR-052). A designed prop with nothing to measure, enlarged as a
# readable prop (FR-051): stylized scale 2.6, where the sign stands about 1.53 m wide, inside the window's opening, as
# the Author chose on 2026-10-26 (D2: "Keep the 1.5 m sign, and give the word a larger panel inside it"). The word's
# panel, 0.29 × 0.058 between the counters and the tube, holds the word at the legibility floor on both reference
# stages; only the two counter faces are exempt from the floor, on the reference phone alone, their figures in the
# text copy's "Around the room" (FR-052; the Author, 2026-10-23: "Take both recommendations."). Lookdev sets the scale
# again (Confirmation 8). The size, bounds, glow, and budget are the studio's build at 2.6 with these stacked faces (the
# Author's option A, 2026-11-07): the sign grew 2.4 cm at scale 1, 6.3 cm at 2.6, to clear the word panel, so its top
# stands higher over the walls and the window; the faces keep their centres and sizes, on the backing at z 0.0048, and
# the stand-in's backing and tubes stand within the new depth (RG2).
version: 1
id: neon-sign
name: Neon arrow sign
size: { w: 0.5949, h: 0.29, d: 0.0337 }
stylized_scale: 2.6
origin:
  point: the middle of the clip, where it sits on the monitor's top edge.
  bounds: { min: [-0.257, -0.02, -0.015], max: [0.3379, 0.27, 0.0187] }
live_faces:
  - role: word
    at: [0, 0.2, 0.0048]
    size: [0.29, 0.058]
    facing: [0, 0, 1]
    up: [0, 1, 0]
    px: [1485, 297]
    readable: true
  - role: call
    at: [0, 0.15, 0.0048]
    size: [0.46, 0.04]
    facing: [0, 0, 1]
    up: [0, 1, 0]
    px: [2048, 178]
    readable: true
  - role: visit
    at: [0, 0.102, 0.0048]
    size: [0.46, 0.04]
    facing: [0, 0, 1]
    up: [0, 1, 0]
    px: [2048, 178]
    readable: true
  - role: second-line
    at: [0, 0.064, 0.0048]
    size: [0.46, 0.02]
    facing: [0, 0, 1]
    up: [0, 1, 0]
    px: [2048, 89]
    readable: false
glows:
  # Spec 014 (FR-044, FR-045; PD-15; D3; Amendment W10): the glow follows the tube that frames the arrow, the stand-in's
  # tubes' polyline at their z, closed, with a spread of 1.5 cm at scale 1 (about 4 cm at the sign's 2.6), in place of
  # the 0.3 m disc behind the sign; the letters keep their own tube pass. Lookdev may tune both, a data edit.
  - id: tube-glow
    path:
      - [-0.244, 0.04, 0.0137]
      - [0.254, 0.04, 0.0137]
      - [0.318, 0.136, 0.0137]
      - [0.254, 0.232, 0.0137]
      - [-0.244, 0.232, 0.0137]
      - [-0.244, 0.04, 0.0137]
    spread: 0.015
    tone: neon-warm
    motion: flicker
standin:
  - { shape: box, size: [0.03, 0.04, 0.03], at: [0, 0, 0], color: graphite }
  - shape: polygon
    points: [[-0.254, 0.03], [0.254, 0.03], [0.33, 0.136], [0.254, 0.242], [-0.254, 0.242]]
    depth: 0.008
    at: [0, 0, 0]
    color: ink
  - { shape: tube, from: [-0.244, 0.04, 0], to: [0.254, 0.04, 0], radius: 0.004, at: [0, 0, 0.0137], color: neon-tube }
  - { shape: tube, from: [0.254, 0.04, 0], to: [0.318, 0.136, 0], radius: 0.004, at: [0, 0, 0.0137], color: neon-tube }
  - { shape: tube, from: [0.318, 0.136, 0], to: [0.254, 0.232, 0], radius: 0.004, at: [0, 0, 0.0137], color: neon-tube }
  - {
      shape: tube,
      from: [0.254, 0.232, 0],
      to: [-0.244, 0.232, 0],
      radius: 0.004,
      at: [0, 0, 0.0137],
      color: neon-tube,
    }
  - {
      shape: tube,
      from: [-0.244, 0.232, 0],
      to: [-0.244, 0.04, 0],
      radius: 0.004,
      at: [0, 0, 0.0137],
      color: neon-tube,
    }
drawing: { from: standin }
budget: { gzip_bytes: 300000, triangles: 11000, texture_px: 1, texture_bytes: 1 }
model: { file: neon-sign.glb }
work_order:
  method: >-
    Model the sign from the dimension sheet: the arrow-shaped backing, one neon tube bent along its outline, and the
    clip that grips the monitor's top edge. The word panel, the two counter panels, and the line below them are four
    flat quads on the backing, the live faces named for their roles, each one plain colour: the room draws the word
    and the figures on them and lights the tube.
  shots: []
  measurements: []
  studio_notes: >-
    An original arrow in the look's own style: no tube or shape spelling a letter or a digit, and no logo, wordmark,
    brand colour, or game asset of any kind (FR-021, FR-046). The tube's colour is a flat base colour; its glow is the
    room's, never an emissive material (FR-022).
