# The gateway's adapters and each environment class's route (contracts/config-files.md §1). Agents edit this file,
# reviewed in the merge-request note; its schema keeps every primary local, a paid adapter in prod's route only, and
# synthetic spend in dev's only. The gateway selects the route by H4_ENV: prod for prod, dev for dev and dev-cpu; and
# on prod by H4_HOST, from spec 001's schema 2.
#
# It grows in steps, so every adapter it defines is registered when it lands (§1.2, rule R6). This is the sixth step:
# tasks.md T073 added the synthetic adapter and dev's fallback, T102 added bedrock with a placeholder model, T105 set
# the model the Author confirmed, Claude Haiku 5.5's US inference profile, and added prod's fallback, spec 010 added
# anthropic, the Anthropic API, beside bedrock, and its T059 makes the Anthropic API prod's fallback, the Author's
# choice of 2026-11-09, after his price, his cap, his key, and his words in the disclosure's row F3 (spec 010, FR-002,
# FR-039), each of which the gateway, preflight, or the test suite holds him to. Bedrock stays defined, so going back
# is the one line `fallback: bedrock`. Spec 001's T070 makes it schema 2, a route per host, with the laptop's line
# alone: the seventh step.
schema: 2
deadline_ms: 20000

adapters:
  local:
    type: openai-compatible
    kind: local
    provider: local
    base_url_env: LOCAL_MODEL_BASE_URL # http://model-server:8080/v1 in every env file
    model_env: LOCAL_MODEL_NAME # the stack's MODEL_ALIAS
    timeouts: { connect_ms: 1000, request_ms: 10000 }
    health: { path: /models, interval_ms: 1000, timeout_ms: 800, unhealthy_after: 1, healthy_after: 3 }

  bedrock:
    type: bedrock-converse
    kind: paid
    region: us-east-1
    # The Author's choice (2026-10-12, aws bedrock list-inference-profiles): it routes to us-east-1, us-east-2, and
    # us-west-2 only, as docs/data-flow-disclosure.md's F1 says.
    model: us.anthropic.claude-haiku-5-5
    # Haiku 5.5 thinks by default, and its thinking counts against the cap: hello's 128 tokens could end in thinking
    # with no text. Off, which this model accepts at its default effort, medium.
    additional_request_fields: { thinking: { type: disabled } }
    # Haiku 5.5 "takes no temperature but its default, 1" (provider-adapter.md §5.4), so the twin's 0.3 reaches the
    # local model alone, and Bedrock gets none (spec 007 D22; spec 010 FR-017).
    temperature: model_default
    timeouts: { connect_ms: 1000, request_ms: 4000 }
    # A twin turn's one attempt (spec 007's plan, D43, the Author's "9 s for twin turns"): ~9k tokens in and up to 300
    # out ran past 4 s in about 7% of his Bedrock turns. Hello keeps 4 s and its retry (SC-005); R9 holds the twin turn
    # to the deadline: local 10,000 + 500 + 9,000 = 19,500.
    twin_request_ms: 9000
    retry: { on: [rate_limited], max: 1, backoff_ms: 250 }
    circuit: { failures: 3, open_s: 30 }
    health: { interval_ms: 10000 }
    credentials_warn_before_s: 7200

  anthropic:
    type: anthropic-messages
    kind: paid
    # Claude Haiku 5.5 through Anthropic's own API (spec 010), the model bedrock's profile names. The endpoint is the
    # adapter's constant, https://api.anthropic.com; prod's env file holds the key, which compose passes to the gateway.
    model: claude-haiku-5-5
    api_key_env: GATEWAY_ANTHROPIC_API_KEY
    thinking: disabled # as on bedrock: hello's 128 tokens could end in thinking with no text
    # "it takes no temperature but its default, 1" (provider-adapter.md §5.4), as on bedrock (spec 010 FR-017).
    temperature: model_default
    timeouts: { connect_ms: 1000, request_ms: 4000 }
    twin_request_ms: 9000 # as on bedrock (spec 007's plan, D43)
    retry: { on: [rate_limited], max: 1, backoff_ms: 250 }
    circuit: { failures: 3, open_s: 30 }
    # The model lookup spends no tokens; once a minute, since each one is a request to Anthropic (plan D6).
    health: { interval_ms: 60000 }

  synthetic:
    type: synthetic
    kind: synthetic
    model: metered-test
    output_tokens: 1000 # 1,000 tokens at dev's $100 per million = $0.10 a call

envs:
  # Schema 2 (spec 001, tasks.md T070; its data-model.md §2.1): prod's route per host, which each gateway selects by
  # H4_HOST. The laptop's line is the route main named for prod; EC2's line, `ec2: { first: ..., second: ... }`, is the
  # Author's own step (spec 001 tasks.md T095; ADR 0041), and until it is here a gateway on EC2 refuses to start
  # (route_missing).
  prod:
    hosts:
      # The Anthropic API, the Author's choice of 2026-11-09 (spec 010, T059); bedrock, defined above, is one line
      # away. The paid fallback, inside the $2 a day sub-budget (FR-030).
      laptop: { primary: local, fallback: anthropic }
      ec2: { first: anthropic, second: bedrock }
  dev: { primary: local, fallback: synthetic } # synthetic only with GATEWAY_TEST_SYNTHETIC_SPEND=1
